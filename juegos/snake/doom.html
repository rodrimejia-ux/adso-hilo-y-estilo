<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Neón</title>
  <link rel="stylesheet" href="./graficos.css">
</head>
<body>

  <div class="game-container">
    <h1>SNAKE NEÓN</h1>

    <div class="scoreboard">
      <div class="score-box">
        <span class="label">PUNTOS</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-box">
        <span class="label">MÁXIMO</span>
        <span id="high-score" class="value">0</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="720" height="720"></canvas>
      <div id="ready-screen" class="overlay">
        <h2>SNAKE NEÓN</h2>
        <p class="overlay-text">Presiona una flecha o <b>W / A / S / D</b> para empezar</p>
      </div>
      <div id="pause-screen" class="overlay hidden">
        <h2>PAUSA</h2>
        <p class="overlay-text">Presiona <b>P</b>, <b>Espacio</b> o el botón para continuar</p>
      </div>
      <div id="game-over-screen" class="overlay hidden">
        <h2>¡JUEGO TERMINADO!</h2>
        <p id="final-score" class="overlay-text"></p>
        <button id="restart-btn" class="btn">JUGAR DE NUEVO</button>
      </div>
    </div>

    <div class="controls-row">
      <button id="pause-btn" class="btn btn-small">PAUSA</button>
    </div>

    <p class="controls-hint">Flechas o <b>W / A / S / D</b> · Desliza el dedo en móvil · <b>P</b> o <b>Espacio</b> para pausar</p>
  </div>

  <script src="./mecanismos.js"></script>
</body>
</html>
